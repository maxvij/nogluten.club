<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || system);
    // Live-update when OS theme changes, but only if user hasn't manually set a preference
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) {
        var t = e.matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        var icon = document.querySelector('.theme-icon');
        if (icon) icon.textContent = t === 'light' ? '☽' : '☀';
      }
    });
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nogluten.club — Curated healthy recipes, gluten-free &amp; lactose-free</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<link href="styles.css" rel="stylesheet" />
</head>
<body>


<div class="sheet-backdrop" id="sheetBackdrop"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sheet-handle" aria-hidden="true"></div>

    <div class="sidebar-header">
      <div style="position:relative;width:100%">
        <input class="search-input" id="searchInput" type="search" placeholder="Search recipes…" aria-label="Search recipes" autocomplete="off">
        <kbd style="position:absolute;right:0.625rem;top:50%;transform:translateY(-50%);font-size:0.75rem;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:0.1rem 0.35rem;pointer-events:none">/</kbd>
      </div>
    </div>

    <div class="sidebar-body">
      <div class="sidebar-section">
        <label class="sidebar-option">
          <input type="checkbox" id="favFilter"> ♥ Favourites only
        </label>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-option">
          <input type="checkbox" name="category" value="breakfast"> Breakfast
        </label>
        <label class="sidebar-option">
          <input type="checkbox" name="category" value="lunch"> Lunch
        </label>
        <label class="sidebar-option">
          <input type="checkbox" name="category" value="dinner"> Dinner
        </label>
        <label class="sidebar-option">
          <input type="checkbox" name="category" value="snack"> Snacks
        </label>
      </div>

      <div class="sidebar-section">
        <div class="time-chips">
          <button class="time-btn" data-time="15">≤ 15 min</button>
          <button class="time-btn" data-time="30">15–30 min</button>
          <button class="time-btn" data-time="30+">30+ min</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label" style="margin-bottom:0.75rem">In my fridge</div>
        <input class="search-input" id="pantrySearch" type="search" placeholder="Search ingredients…" aria-label="Search ingredients" autocomplete="off" style="margin-bottom:0.75rem">
        <div class="pantry-view-toggle">
          <button class="pvt-btn active" data-view="cat">Categorized</button>
          <button class="pvt-btn" data-view="az">A–Z</button>
        </div>
        <div id="pantry-items"></div>
        <button class="pantry-clear" id="pantryClear" hidden>Clear all</button>
      </div>
    </div>

    <div class="sidebar-footer">
      <span class="sidebar-count" id="resultCount"></span>
      <button class="sidebar-reset-btn" id="sidebarReset">Reset</button>
    </div>

    <button class="sheet-apply-btn" id="sheetApply">Apply filters</button>
  </aside>

  <main>
    <div class="main-header">
      <div class="logo-block">
        <h1>nogluten<em>.club</em></h1>
      </div>
      <p class="header-slogan">Curated healthy recipes — gluten-free &amp; lactose-free</p>
      <div class="main-header-right">
        <button class="mobile-filter-toggle" id="mobileFilterToggle" aria-expanded="false">Filters</button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon">☽</span>
        </button>
      </div>
    </div>

    <div class="main-body">
      <div class="sort-bar">
        <div class="sort-bar-left">
          <div id="filterSummary"></div>
        </div>
        <div class="sort-control">
          <button class="sort-btn active" data-sort="default">Default</button>
          <button class="sort-btn" data-sort="protein">Protein ↓</button>
          <button class="sort-btn" data-sort="kcal">Kcal ↓</button>
        </div>
      </div>
      <div class="empty-state" id="emptyState">No recipes match your filters.</div>

      <!-- BREAKFAST -->
      <section class="category-section cat-breakfast" data-category="breakfast">
        <div class="section-header">
          <h2><span class="cat-dot"></span>Breakfast</h2>
          <span class="section-count">4 recipes</span>
        </div>
        <div class="recipe-grid" id="breakfast-grid"></div>
      </section>

      <!-- LUNCH -->
      <section class="category-section cat-lunch" data-category="lunch">
        <div class="section-header">
          <h2><span class="cat-dot"></span>Lunch</h2>
          <span class="section-count">4 recipes</span>
        </div>
        <div class="recipe-grid" id="lunch-grid"></div>
      </section>

      <!-- DINNER -->
      <section class="category-section cat-dinner" data-category="dinner">
        <div class="section-header">
          <h2><span class="cat-dot"></span>Dinner</h2>
          <span class="section-count">4 recipes</span>
        </div>
        <div class="recipe-grid" id="dinner-grid"></div>
      </section>

      <!-- SNACKS -->
      <section class="category-section cat-snack" data-category="snack">
        <div class="section-header">
          <h2><span class="cat-dot"></span>Snacks &amp; High-Protein</h2>
          <span class="section-count">4 recipes</span>
        </div>
        <div class="recipe-grid" id="snack-grid"></div>
      </section>
    </div>
  </main>
</div>

<button class="shop-fab" id="shopFab" hidden>Shopping list</button>

<!-- Shopping list modal -->
<dialog id="shopModal">
  <div class="shop-modal-header">
    <button class="modal-close" id="shopModalClose" aria-label="Close">✕</button>
    <h2 class="modal-title">Shopping list</h2>
  </div>
  <div class="modal-body" id="shopModalBody"></div>
</dialog>

<!-- Recipe modal -->
<dialog id="recipeModal" aria-labelledby="modalTitle">
  <div class="modal-header">
    <button class="modal-close" id="modalClose" aria-label="Close recipe">✕</button>
    <div class="modal-cat-label" id="modalCat"></div>
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-stats" id="modalStats"></div>
  </div>
  <div class="modal-body" id="modalBody"></div>
</dialog>

<script src="main.js" type="text/javascript"></script>
</body>
</html>
